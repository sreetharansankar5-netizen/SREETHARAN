<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="center-page">

<div class="login-card card">

    <div class="logo big">
        🚗 Home Car Wash
    </div>

    <h1>Welcome Back</h1>

    <p>
        Login to manage your car wash bookings.
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            required
        >

        <label>Password</label>

        <input
            type="password"
            placeholder="Enter password"
            required
        >

        <label class="check">
            <input type="checkbox">
            Remember me
        </label>

        <button class="btn full">
            Login
        </button>

    </form>

    <p class="center">
        Demo: Any valid email and password can be used.
    </p>

    <a href="index.html">
        ← Back to Home
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
